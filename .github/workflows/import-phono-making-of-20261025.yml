name: Import phonoteka making-of image
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-phono-making-of-20261025.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Import user provided photo
        shell: bash
        env:
          INPUT_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/842a76ad-2844-41e4-ba85-9daae2455387.png
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 -L --fail --max-time 65 "$INPUT_URL" -o /tmp/album-studio.png
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          i=ImageOps.exif_transpose(Image.open('/tmp/album-studio.png')).convert('RGB')
          assert i.width>=1400 and i.height>=1000, i.size
          dest=Path('ai/avtor/60/test/1/assets/making-of-studio-20261025.webp')
          dest.parent.mkdir(parents=True,exist_ok=True)
          i.save(dest, 'WEBP',quality=85, method=6)
          assert dest.stat().st_size>55000
          print('ASSET_READY',dest,i.size,dest.stat().st_size)
          PY
      - name: Commit studio image only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ai/avtor/60/test/1/assets/making-of-studio-20261025.webp
          if git diff --cached --quiet; then
            echo ASSET_ALREADY_PRESENT
          else
            git commit -m "Add submitted studio making-of photo to phonoteka"
            git pull --rebase origin main
            git push origin HEAD:main
          fi