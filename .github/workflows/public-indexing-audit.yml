          class Meta(HTMLParser):
              def __init__(self): super().__init__(); self.robots=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='meta' and (a.get('name') or '').lower() in ('robots','googlebot','yandex','yandexbot','bingbot'):
                      self.robots.append((a.get('name'),a.get('content') or ''))
          def request(url):
              q=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 SiteIndexAudit/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(q,timeout=10) as r:
                  return r.status,r.geturl(),r.headers.get('X-Robots-Tag',''),r.read()
          def check(item):
              host,p=item
              try:
                  path='/' + urllib.parse.quote(p)
                  if path.endswith('/index.html'): path=path[:-10]
                  status,final,h,body=request(host+path)
                  if urllib.parse.urlsplit(host).netloc!=urllib.parse.urlsplit(final).netloc:
                      return host,p,'REDIRECT',final
                  parser=Meta(); parser.feed(body.decode('utf-8',errors='replace'))
                  allowed=('noindex' in h.lower() or any(n.lower()=='robots' and 'noindex' in v.lower() for n,v in parser.robots))
                  return host,p,'PASS' if allowed else 'FAIL',str(status)+' '+h+' '+str(parser.robots)[:150]
              except Exception as e: return host,p,'ERROR',str(e)
          for host in [*pages,'https://metodborzilova.ru']:
              try:
                  status,final,h,body=request(host+'/robots.txt')
                  print('ROBOTS',host,status,h,body.decode(errors='replace')[:500],flush=True)
              except Exception as e: print('ROBOTS ERROR',host,e,flush=True)
          try:
              status,final,h,body=request('https://metodborzilova.ru/')
              parser=Meta(); parser.feed(body.decode(errors='replace'))
              print('PROTECTED METHOD HOME',status,h,parser.robots,flush=True)
          except Exception as e: print('METHOD ERROR',e,flush=True)
          items=[(h,p) for h,ps in pages.items() for p in ps]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              results=list(pool.map(check,items))
          for row in results:
              if row[2]!='PASS': print('EXCEPTION',*row,flush=True)
          for host in pages:
              rows=[r for r in results if r[0]==host]
              print('RESULT',host,len(rows),{s:sum(r[2]==s for r in rows) for s in ('PASS','FAIL','ERROR','REDIRECT')},flush=True)
          if any(row[2]!='PASS' for row in results): raise SystemExit(1)
          PY
