name: AI production analytics cache fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-analytics-cache-fix.yml"
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update only the analytics asset reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('ai/index.html')
          s=f.read_text()
          old='/analytics.js?v=20261020-clarity-ai1'
          new='/analytics.js?v=20261022-journey-v1'
          assert s.count(old)==1
          f.write_text(s.replace(old,new))
          PY
      - name: Commit the changed cache key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/index.html
          git commit -m "Refresh production AI analytics asset cache after journey upgrade"
          git push origin HEAD:main
