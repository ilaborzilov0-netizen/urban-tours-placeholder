name: AI retargeting two-day read-only report
on:
  push:
    branches: [main]
    paths:
      - "ai/audit_retargeting_20261022.py"
      - ".github/workflows/ai-retargeting-report.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      YANDEX_METRIKA_OAUTH: ${{ secrets.YANDEX_METRIKA_OAUTH }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Oct 21–22 Metrika visits and goal users, without mutations
        run: python3 ai/audit_retargeting_20261022.py
