name: Import ten gallery portrait assets
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-phono-gallery-photos-20261025.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Save original user-supplied images as optimized WebP
        shell: bash
        env:
          IMAGE_01: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/d77ce3eb-c78a-4783-9e03-c4ba0f9806ef.png
          IMAGE_02: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/e5ec91fd-f9e8-4d0e-9b44-16e19e0fbcb7.png
          IMAGE_03: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/63525733-0c17-4ede-a392-312d26e48577.png
          IMAGE_04: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/24de6cc0-abe6-4cc2-b6ea-90b4194718c8.png
          IMAGE_05: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/89b553d1-dda2-4311-9e83-255f6eb2be04.png
          IMAGE_06: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/c802d193-105a-40f5-a561-3d3c027eb68b.png
          IMAGE_07: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/691ecef4-732f-4f6a-899e-925f59a7c351.png
          IMAGE_08: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/c65e46bb-9c44-4bb8-b0bc-4c9304b3d3b7.png
          IMAGE_09: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/f3e69db4-2129-43ec-aae8-b6a08e92d440.png
          IMAGE_10: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/bdc56bd2-5acd-4594-a5d4-c4802d204537.png
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow requests
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import os, requests, io
          target=Path('ai/avtor/60/test/1/assets/people')
          target.mkdir(parents=True,exist_ok=True)
          for i in range(1,11):
              name=f'IMAGE_{i:02}'
              r=requests.get(os.environ[name],timeout=45)
              r.raise_for_status()
              src=ImageOps.exif_transpose(Image.open(io.BytesIO(r.content))).convert('RGB')
              if min(src.size)<900:raise ValueError(f'Unexpected low-res image {i} {src.size}')
              src.thumbnail((820,1180),Image.Resampling.LANCZOS)
              dest=target/f'person-{i:02}.webp'
              src.save(dest,'WEBP',quality=84,method=6)
              if dest.stat().st_size<30000:raise ValueError(f'Unexpected asset size {i}')
              print('PHOTO_OK',i,src.size,dest.stat().st_size)
          PY
      - name: Commit only these gallery files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ai/avtor/60/test/1/assets/people/person-*.webp
          if git diff --cached --quiet; then
            echo "PHOTO_ASSETS_ALREADY_PUBLISHED"
          else
            git commit -m "Store ten uploaded album gallery photos locally in phonoteka"
            git pull --rebase origin main
            git push origin HEAD:main
          fi