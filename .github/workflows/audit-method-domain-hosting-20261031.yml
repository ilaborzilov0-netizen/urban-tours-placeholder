name: Verify Timeweb app mapping for target domain (read-only)
on:
  push:
    branches: [codex/check-method-domain-hosting-20261031]
    paths:
      - '.github/workflows/audit-method-domain-hosting-20261031.yml'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TIMEWEB_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN || secrets.TIMEWEB_API_TOKEN || secrets.TIMEWEB_TOKEN }}
    steps:
      - name: Read-only Timeweb inventory and DNS diagnosis
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,socket
          token=os.environ.get("TIMEWEB_TOKEN","").strip()
          print("TOKEN_PRESENT",bool(token))
          for domain in ("metodborzilova.ru","marafon-metod.ru"):
              try:
                  print("DOMAIN_IP",domain, sorted(set(x[4][0] for x in socket.getaddrinfo(domain,443,proto=socket.IPPROTO_TCP))))
              except Exception as e:
                  print("DNS_ERROR",domain,type(e).__name__)
          if not token: quit()
          for path in ("/api/v1/apps", "/api/v1/apps/234071"):
              url="https://api.timeweb.cloud"+path
              try:
                  req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=25) as resp: data=json.load(resp)
                  apps=data.get("apps") if path.endswith("/apps") else [data.get("app")]
                  if not isinstance(apps,list): apps=[]
                  print("TIMEWEB_RESULT",path,"count",len(apps))
                  for app in apps:
                      if not isinstance(app,dict): continue
                      allow=("id","name","status","domain","domains","external_domain","repository","git_repository","repo","auto_deploy","deploy_source","branch","status_code","url")
                      safe={k:app[k] for k in allow if k in app}
                      print("TIMEWEB_APP_SAFE",json.dumps(safe,ensure_ascii=False,default=str)[:2000])
              except urllib.error.HTTPError as e: print("TIMEWEB_HTTP",path,e.code)
              except Exception as e: print("TIMEWEB_ERROR",path,type(e).__name__,str(e)[:100])
          PY
