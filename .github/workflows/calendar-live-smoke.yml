name: Calendar landing smoke
on:
  push:
    branches: [main]
    paths:
      - "календарь/**"
      - "tests/calendar-interaction.mjs"
      - ".github/workflows/calendar-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser-DOM simulator for interactive verification
        run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - name: Test click flows, time reveal and booking confirmation
        run: node tests/calendar-interaction.mjs
      - name: Validate calendar JavaScript and HTML contract
        run: |
          node --check "календарь/calendar.js"
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('календарь/index.html','utf8');
          const js=fs.readFileSync('календарь/calendar.js','utf8');
          for(const required of ['id="calendar"','id="calendar-form"','id="calendar-success"','calendar-fallback-hint','id="calendar-time-stage"','id="calendar-date-stage"','cal-date-check','/календарь/calendar.js','consultation-portrait-20261008.webp','МСК · UTC+3']) {
            if(!html.includes(required))throw Error('Missing '+required);
          }
          for(const required of ['/api/consultation/slots','/api/consultation/book','/api/leads','response.status===409','await refresh()','selectedDay=\'\'','renderTimes(true)']) {
            if(!js.includes(required))throw Error('Missing '+required);
          }
          console.log('PASS calendar page contract');
          NODE
      - name: Check public Timeweb page when deployed (read only)
        run: |
          node - <<'NODE'
          (async()=>{
            const url='https://marafon-metod.ru/%D0%BA%D0%B0%D0%BB%D0%B5%D0%BD%D0%B4%D0%B0%D1%80%D1%8C/';
            try{
              const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(15000)});
              const body=await r.text();
              const checks={widget:body.includes('id="calendar"'),title:body.includes('Выберите удобное время.'),fallbackHint:body.includes('calendar-fallback-hint'),progressive:body.includes('id="calendar-time-stage" class="cal-time-stage" hidden'),dateStage:body.includes('id="calendar-date-stage"'),successTitle:body.includes('calendar-success-title'),script:body.includes('/календарь/calendar.js')};
              const live=r.status===200&&Object.values(checks).every(Boolean);
              console.log('PUBLIC_CALENDAR',JSON.stringify({status:r.status,finalUrl:r.url,live,checks,contentLength:body.length}));
              if(!live)process.exitCode=1;
            }catch(e){console.log('PUBLIC_CALENDAR_UNVERIFIED',e.message);process.exitCode=1;}
          })();
          NODE

      - name: Inspect public booking API and calendar JavaScript without writing leads
        run: |
          node - <<'NODE'
          (async()=>{
            for(const [name,url] of [
              ['CALENDAR_SCRIPT','https://marafon-metod.ru/%D0%BA%D0%B0%D0%BB%D0%B5%D0%BD%D0%B4%D0%B0%D1%80%D1%8C/calendar.js'],
              ['BOOKING_SLOTS','https://api.marafon-metod.ru/api/consultation/slots']
            ]) {
              try{
                const r=await fetch(url,{signal:AbortSignal.timeout(12000)});
                const text=await r.text();
                console.log(name,JSON.stringify({http:r.status,jsReady:name==='CALENDAR_SCRIPT'?(text.includes('isFallback')&&text.includes("selectedDay=''")):undefined,apiReady:name==='BOOKING_SLOTS'?text.includes('"timezone":"Europe/Moscow"'):undefined,bytes:text.length}));
              }catch(e){console.log(name,'UNAVAILABLE',e.message)}
            }
          })();
          NODE
