name: AI landing analytics verification
on:
  push:
    branches: [main]
    paths:
      - "ai/index.html"
      - "ai/posthog-init.js"
      - "analytics.js"
      - "predfinal/offer.js"
      - "predfinal/checkout.js"
      - "tests/ai-analytics-smoke.mjs"
      - ".github/workflows/ai-analytics-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test browser
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify PostHog and Clarity without sending real analytics
        run: node tests/ai-analytics-smoke.mjs
      - name: Verify new scripts reached the public website
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time,sys,re
          origin='https://marafon-metod.ru'
          def get(path):
              print('Checking public resource:',path,flush=True)
              req=urllib.request.Request(origin+path,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as response:
                  return response.status,response.read().decode('utf-8','replace')
          for attempt in range(1,9):
              try:
                  s,html=get('/ai/?check=ai-analytics-20261020')
                  a=html.count('/ai/posthog-init.js?v=20261020-prod1')==1
                  b=html.count('/analytics.js?v=20261020-clarity-ai1')==1
                  c='offer.js?v=20261020-ga4-v35' in html and 'checkout.js?v=20261020-ga4-v9' in html
                  d='https://www.googletagmanager.com/gtag/js?id=G-J076WS14NV' in html
                  e="gtag('config','G-J076WS14NV'" in html
                  if a and b and c and d and e:
                      _,posthog=get('/ai/posthog-init.js?v=20261020-prod1')
                      _,clarity=get('/analytics.js?v=20261020-clarity-ai1')
                      _,offer=get('/predfinal/offer.js?v=20261020-ga4-v35')
                      _,checkout=get('/predfinal/checkout.js?v=20261020-ga4-v9')
                      if all([
                          'https://eu.i.posthog.com' in posthog,
                          'disable_session_recording:true' in posthog,
                          'xpsxeyxojq' in clarity,
                          'posthog?.capture?' in offer,
                          'posthog?.capture?' in checkout,
                          "window.gtag?.('event'" in offer,
                          "window.gtag?.('event'" in checkout
                      ]):
                          print('PASS: live /ai/ serves GA4 G-J076WS14NV, EU PostHog, Clarity and Yandex goal forwarding without test traffic.')
                          sys.exit(0)
                  print('Attempt',attempt,'html ready:',a,b,c,d,e)
              except Exception as e:print('Attempt',attempt,'error',repr(e))
              if attempt<8:time.sleep(4)
          sys.exit('FAIL: scripts are not all deployed to live /ai/')
          PY
