name: Predfinal checkout browser smoke (mock API)
on:
  push:
    branches: [main]
    paths:
      - "predfinal/index.html"
      - "predfinal/offer.js"
      - "predfinal/offer.css"
      - "predfinal/checkout.js"
      - "tests/predfinal-browser-smoke.mjs"
      - ".github/workflows/predfinal-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify checkout and question UX against mock payment API
        run: node tests/predfinal-browser-smoke.mjs
