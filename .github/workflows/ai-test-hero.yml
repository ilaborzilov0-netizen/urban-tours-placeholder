name: AI test variant validation
on:
  push:
    branches: [main]
    paths:
      - "ai/test/**"
      - "tests/ai-test-hero-smoke.mjs"
      - ".github/workflows/ai-test-hero.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test independent copy, offers, calculator, bank-safe return, mobile and desktop
        run: node tests/ai-test-hero-smoke.mjs
  public-url:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify published /ai/test/ and that /ai/ stayed unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time,os,sys
          root='https://marafon-metod.ru'
          def fetch(path):
              req=urllib.request.Request(root+path,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=16) as resp:
                  return resp.status,resp.read().decode('utf8','replace')
          for i in range(1,10):
              try:
                  status,test=fetch('/ai/test/?variant_validation='+os.environ.get('GITHUB_RUN_ID','manual')+'&try='+str(i))
                  original_status,original=fetch('/ai/?compare_test_variant='+str(i))
                  expected=(
                      status==200 and original_status==200
                      and 'Бросьте курить,<br><span>просто слушая аудио.</span>' in test
                      and 'class="ai-test-mechanism"' in test
                      and 'class="ai-test-guarantee"' in test
                      and '<p class="ai-test-contents">Два альбома · 20 аудиоякорей</p>' in test
                      and '<p class="ai-test-price"><strong>1 990 ₽</strong>' in test
                      and 'за оба альбома в одном звучании' in test
                      and 'class="ai-test-access"' in test
                      and '<div class="ai-test-look-at-tiers"><a href="#pricing">Смотреть тарифы →</a></div>' in test
                      and test.index('class="ai-test-mechanism"') < test.index('class="ai-test-look-at-tiers"') < test.index('class="album-showcase section"')
                      and 'Как знакомый припев, она остаётся в голове' in test
                      and 'Аудиоякорь</strong> — короткая запись, которую слушаешь как обычную музыку' not in test
                      and '<p class="ai-test-price">от ' not in test
                      and 'class="ai-test-look-at-tiers"' in test
                      and 'href="https://marafon-metod.ru/ai/test/"' in test
                      and 'src="/ai/test/checkout.js?' in test
                      and 'src="/ai/test/offer.js?' in test
                      and 'src="/ai/test/goal-tracking.js?' in test
                      and test.count('<article class="price-card')==3
                      and 'Научная логика подхода' not in test
                      and 'Научная логика подхода' in original
                  )
                  print('Published variant attempt',i,'status',status,'original',original_status,'expected',expected,'bytes',len(test))
                  if expected:
                      for path in ['/ai/test/checkout.js?v=20261021-v1','/ai/test/offer.js?v=20261021-v1','/ai/test/goal-tracking.js?v=20261021-v1']:
                          script_status,script=fetch(path)
                          if script_status!=200 or len(script)<1000:raise RuntimeError('missing test script '+path)
                      print('PASS: live /ai/test/ distinct, original /ai/ preserved, all variant JS present')
                      sys.exit(0)
              except Exception as exc:
                  print('not ready:',str(exc)[:200])
              time.sleep(10)
          sys.exit('FAIL: /ai/test/ has not deployed or differs from expected source')
          PY
