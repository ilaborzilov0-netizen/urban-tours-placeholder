name: Verify author60 concept gallery and twelve accordion track meanings
on:
  push:
    branches: [audit/20261024-yandex-readonly]
    paths: [.github/workflows/verify-author60-gallery-tracks-20261025.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Confirm published concept sections, all images and mock checkout only
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const root='https://marafon-metod.ru';
          let s='',status=0;
          for(let i=0;i<20;i++){
            const r=await fetch(root+'/ai/avtor/60/test/?gallery_tracks='+i,{cache:'no-store',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            status=r.status;s=await r.text();
            if(status===200&&s.includes('class="track-chapters"')&&s.includes('data-scene="music"'))break;
            if(i<19)await new Promise(r=>setTimeout(r,5000));
          }
          const vals={
            status, gallery:s.includes('class="photo-story-grid"'),
            sceneCount:(s.match(/class="scene-image"/g)||[]).length,
            embeddedWebp:(s.match(/src="data:image\/webp;base64,/g)||[]).length,
            chapters:(s.match(/class="track-chapter"/g)||[]).length,
            tracks:(s.match(/class="meaning-track"/g)||[]).length,
            realTrackNames:s.includes('Кофе остаётся')&&s.includes('Не с понедельника')&&s.includes('Тише внутри')&&s.includes('Обычный день'),
            descriptions:s.includes('class="meaning-description"'),
            demo:s.includes('life-gets-better-demo-20261008.mp3'),
            previewNotice:s.includes('История героя вымышленная'),
            noBackend:!s.includes('/api/payment/create')&&!s.includes('/api/leads'),
            price:s.includes('1 990 ₽'),
          };
          console.log('PUBLISH_CHECK',JSON.stringify(vals));
          assert.ok(Object.entries(vals).every(([k,v])=>k==='status'?v===200:k==='sceneCount'?v===3:k==='embeddedWebp'?v===3:k==='chapters'?v===3:k==='tracks'?v===12:!!v));
          for(const path of ['/ai/','/ai/avtor/','/ai/avtor/60/']){
            const r=await fetch(root+path,{signal:AbortSignal.timeout(12000)});
            const body=await r.text();
            assert.equal(r.status,200);
            assert.ok(!body.includes('class="photo-story-grid"')&&!body.includes('class="meaning-track"'),'An original landing was changed');
          }
          console.log('PUBLISH_PASS all content deployed, parent pages unchanged');
          JS
      - name: Browser verify scene photos, native accordion and responsive layout
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const width of [1440,768,390,320]){
              const page=await browser.newPage({viewport:{width,height:860},deviceScaleFactor:1});
              const forbidden=[];
              page.on('request',r=>{if(/api\/payment\/create|api\/leads|api-metrika/.test(r.url()))forbidden.push(r.url())});
              await page.goto('https://marafon-metod.ru/ai/avtor/60/test/?gallery_tracks_browser=20261025',{waitUntil:'domcontentloaded',timeout:35000});
              await page.locator('.scene-image').first().scrollIntoViewIfNeeded();
              const imageStates=await page.locator('.scene-image').evaluateAll(async imgs=>await Promise.all(imgs.map(async img=>{
                try { await img.decode();return {ok:true,w:img.naturalWidth,h:img.naturalHeight}; }
                catch(e){return {ok:false,error:String(e)}} 
              })));
              console.log('SCENES',width,JSON.stringify(imageStates));
              assert.equal(imageStates.length,3);
              assert.ok(imageStates.every(x=>x.ok&&x.w>=170&&x.h>=150),'Photo failed to decode or is too small');
              const acc=page.locator('.meaning-track');
              assert.equal(await acc.count(),12);
              assert.equal(await page.locator('.track-chapter').count(),3);
              assert.equal(await acc.filter({has:page.locator('summary')}).count(),12);
              assert.equal(await page.locator('.meaning-track[open]').count(),1);
              await acc.nth(5).locator('summary').click();
              await page.waitForTimeout(180);
              const opened=await page.locator('.meaning-track[open]').evaluateAll(xs=>xs.map(x=>x.getAttribute('data-track-no')));
              console.log('ACCORDION',width,JSON.stringify(opened));
              assert.deepEqual(opened,['6']);
              await acc.nth(5).locator('summary').click();
              await page.waitForTimeout(180);
              assert.equal(await page.locator('.meaning-track[open]').count(),0);
              const layout=await page.evaluate(()=>{
                const rect=s=>{const r=document.querySelector(s).getBoundingClientRect();return {width:Math.round(r.width),height:Math.round(r.height)}};
                const gallery=[...document.querySelectorAll('.photo-story-card')].map(el=>Math.round(el.getBoundingClientRect().width));
                return {view:innerWidth,scroll:document.documentElement.scrollWidth,gallery,
                  track:rect('.track-layout'),side:rect('.track-side'),end:rect('.final-offer')};
              });
              console.log('LAYOUT',width,JSON.stringify(layout));
              assert.ok(layout.scroll<=width+4,'Horizontal overflow');
              assert.ok(layout.gallery.every(x=>x>100));
              assert.ok(layout.track.width>Math.min(240,width-30));
              await page.locator('.meaning-track').first().locator('summary').click();
              await page.locator('.meaning-play').click();
              await page.waitForTimeout(700);
              const audio=await page.locator('#demo-audio').evaluate(a=>({ready:a.readyState,playhead:a.currentTime,paused:a.paused}));
              console.log('DEMO',width,JSON.stringify(audio));
              assert.ok(audio.playhead>0||!audio.paused,'Demo in accordion did not play');
              await page.locator('.track-cta .js-buy').click();
              await page.locator('#concept-dialog').waitFor({state:'visible'});
              assert.equal(forbidden.length,0,'Unexpected live request');
              await page.locator('#close-modal').click();
              await page.screenshot({path:'/tmp/gallery-tracks-'+width+'.png',fullPage:true});
              await page.close();
            }
            console.log('BROWSER_PASS four breakpoints, three photos, twelve accordion tracks, preview checkout and audio');
          }finally{await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: author60-gallery-12-tracks-fullpage
          path: /tmp/gallery-tracks-*.png
          retention-days: 3