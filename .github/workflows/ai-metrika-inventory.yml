name: AI Metrika read-only inventory
on:
  push:
    branches: [main]
    paths:
      - "ai/audit_metrika_inventory.py"
      - ".github/workflows/ai-metrika-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      YANDEX_METRIKA_OAUTH: ${{ secrets.YANDEX_METRIKA_OAUTH }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit all existing goals without mutations
        run: python3 ai/audit_metrika_inventory.py
