name: Predfinal Metрика — live HTML check
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/predfinal-metrika-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-counter:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check published HTML for Yandex Metrika 110906734
        shell: bash
        run: |
          python3 - <<'PY'
          import re, time, urllib.request, urllib.error, sys
          url="https://marafon-metod.ru/predfinal/"
          for attempt in range(1,5):
              try:
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; SiteAudit/1.0)","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(request,timeout=15) as r:
                      body=r.read().decode('utf-8','replace')
                      status=r.status
                      final_url=r.geturl()
                  tag=bool(re.search(r'https://mc\.yandex\.ru/metrika/tag\.js\?id=110906734',body))
                  init=bool(re.search(r'ym\(\s*110906734\s*,\s*[\x27\x22]init[\x27\x22]',body))
                  print("HTTP:",status,"URL:",final_url,"bytes:",len(body))
                  print("Metrika tag script:",tag,"Counter init:",init)
                  print("Webvisor:",bool(re.search(r'webvisor\s*:\s*true',body)))
                  if not tag or not init:
                      print("Counter is NOT fully present in the published HTML.")
                      sys.exit(1)
                  print("PASS: Published /predfinal/ serves Metrika ID 110906734 with tag.js and init.")
                  sys.exit(0)
              except Exception as e:
                  print("Attempt",attempt,"error:",repr(e))
                  if attempt<4:time.sleep(4)
          sys.exit(2)
          PY

      - name: Check live checkout without blocking preflight
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time,sys
          root='https://marafon-metod.ru/predfinal/'
          marker='/predfinal/checkout.js?v=20261020-direct-order-v7'
          for attempt in range(1,7):
              try:
                  def read(url):
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=12) as r:return r.read().decode('utf-8','replace')
                  page=read(root+'?diagnostic=direct-order-v7')
                  has_marker=marker in page
                  script=read('https://marafon-metod.ru'+marker) if has_marker else ''
                  direct="apiRequest('/api/payment/create'" in script
                  preflight='verifyBackendTariffs()' in script
                  print('Attempt',attempt,'new asset referenced:',has_marker,'direct payment create:',direct,'blocking preflight:',preflight)
                  if has_marker and direct and not preflight:
                      print('PASS: Public site is serving direct-order checkout script.')
                      sys.exit(0)
              except Exception as error:print('Attempt',attempt,'error',repr(error))
              if attempt<6:time.sleep(4)
          print('FAIL: Published site still serves stale checkout code.')
          sys.exit(1)
          PY

      - name: Check new 40+ priority is live
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time,sys
          url='https://marafon-metod.ru/predfinal/?audit=hero-priority-20261020'
          for attempt in range(1,7):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=15) as f:content=f.read().decode('utf-8','replace')
                  has_priority='<p class="hero-priority">Даже при стаже <strong>40 лет и больше.</strong></p>' in content
                  has_photo='class="album-cover album-cover--one"' in content
                  order=content.find('class="hero-priority"')<content.find('class="hero-lead-hook"')
                  print('Attempt',attempt,'hero priority live:',has_priority,'album cover exists:',has_photo,'copy order:',order)
                  if has_priority and has_photo and order:
                      print('PASS: Live hero highlights 40+ immediately after the main title.')
                      sys.exit(0)
              except Exception as e:print('Attempt',attempt,'error:',repr(e))
              if attempt<6:time.sleep(4)
          sys.exit(1)
          PY
