name: AI 68 goals browser test
on:
  push:
    branches: [main]
    paths:
      - "ai/goals.json"
      - "ai/goal-tracking.js"
      - "ai/index.html"
      - "predfinal/offer.js"
      - "predfinal/checkout.js"
      - "tests/ai-68-goals-smoke.mjs"
      - ".github/workflows/ai-goals-browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run safe mocked live-page interactions
        run: node tests/ai-68-goals-smoke.mjs
