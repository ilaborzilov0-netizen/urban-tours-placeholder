name: Import one extra voice clip into phonoteka
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-phono-voice06-20261026.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download optimized original user audio in MP3 format
        env:
          AUDIO_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/b79b72eb-769d-44fa-8c3b-1059b202268d.mp3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai/avtor/60/test/1/assets/voices
          curl --retry 4 --retry-delay 2 --fail -LsS --max-time 55 "$AUDIO_URL" -o ai/avtor/60/test/1/assets/voices/voice-06.mp3
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai/avtor/60/test/1/assets/voices/voice-06.mp3')
          assert 100000 <= p.stat().st_size <= 115000,p.stat().st_size
          print('NEW_VOICE_ASSET_OK',p.stat().st_size)
          PY
      - name: Commit exact audio asset only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ai/avtor/60/test/1/assets/voices/voice-06.mp3
          if git diff --cached --quiet; then echo "ALREADY_PRESENT"; else
            git commit -m "Add fifth user voice recording to phonoteka"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
