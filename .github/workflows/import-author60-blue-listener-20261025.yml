name: Import exact pictured man for author60 landing
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-author60-blue-listener-20261025.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Crop exact supplied screenshot photo without altering the person
        env:
          SCREENSHOT_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3KrouuquIhgLmM3Dgm3GoNReITb/be23e938-4185-4efa-9a30-67c8006ff959.png
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai/avtor/60/assets
          curl --fail --silent --show-error --location --retry 3 --max-time 40 "$SCREENSHOT_URL" -o /tmp/author60-screenshot.png
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          screenshot=Image.open('/tmp/author60-screenshot.png').convert('RGB')
          assert screenshot.size==(1149,767), f'Unexpected screenshot shape: {screenshot.size}'
          crop=screenshot.crop((158,118,994,589))
          assert crop.size==(836,471)
          file=Path('ai/avtor/60/assets/listener60-blue-20261025.webp')
          crop.save(file,'WEBP',quality=91,method=6)
          encoded=Image.open(file)
          assert encoded.size==(836,471), 'Bad final image geometry'
          assert file.stat().st_size>35000, 'Unexpected file size'
          print('PHOTO_IMPORTED',str(file),'size',encoded.size,'bytes',file.stat().st_size)
          PY
      - name: Publish only new image asset to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/avtor/60/assets/listener60-blue-20261025.webp
          if git diff --cached --quiet; then
             echo PHOTO_ALREADY_PUBLISHED
          else
             git commit -m "Publish exact pictured man 60+ blue sweater for author60"
             git push origin HEAD:main
          fi