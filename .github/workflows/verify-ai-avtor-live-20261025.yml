name: Verify published author landing without changing production
on:
  push:
    branches: [audit/20261024-yandex-readonly]
    paths: [.github/workflows/verify-ai-avtor-live-20261025.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect both public landings, assets, and backend
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin='https://marafon-metod.ru';
          async function read(path){
            const r=await fetch(origin+path,{cache:'no-store',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(16000)});
            return {status:r.status,url:r.url,body:await r.text(),headers:r.headers};
          }
          let author,base;
          for(let attempt=1;attempt<=15;attempt++){
            [author,base]=await Promise.all([read('/ai/avtor/?audit='+attempt),read('/ai/?audit='+attempt)]);
            if(author.status===200&&author.body.includes('Авторский подход · Илья Борзилов'))break;
            if(attempt<15)await new Promise(resolve=>setTimeout(resolve,5000));
          }
          const checks={
            '200_clone':author.status===200,
            'copy_author_kicker':author.body.includes('Авторский подход · Илья Борзилов'),
            'copy_author_lead':author.body.includes('Работал в клинике Аллена Карра и знаю'),
            'copy_music_approach':author.body.includes('Я соединил психологию отказа от курения с музыкой.'),
            'copy_demo_visible':author.body.includes('author-demo-cta'),
            'copy_demo_text':author.body.includes('Послушать бесплатно · 30 секунд'),
            'copy_mobile_identity':author.body.includes('class="author-mobile-identity"'),
            'copy_ai_credit_below':author.body.includes('ИИ помогает создать музыку и вокал.'),
            'copy_no_ai_credit_in_photo':!author.body.includes('class="author-ai-credit"'),
            'copy_portrait_tag':author.body.includes('/ai/avtor/assets/author-portrait-20261025.jpg'),
            'copy_album_inset':author.body.includes('class="author-album-inset"'),
            'copy_author_caption':author.body.includes('Автор идеи и смысловой программы'),
            'copy_mobile_portrait_css':author.body.includes('aspect-ratio:1/1.05'),
            'copy_price_1990':author.body.includes('const ALBUM_PRICE = 1990;'),
            'copy_payment_sku':author.body.includes("plan:'ai_album_1990'"),
            'copy_track_clientid':author.body.includes("'getClientID'"),
            'copy_tracker_separate':author.body.includes('/ai/avtor/classic-goals.js'),
            'copy_source_tag':author.body.includes("source:'marafon_ai_audioanchors_1990_author'"),
            'copy_noindex':author.body.includes('content="noindex,nofollow"'),
            'base_200':base.status===200,
            'base_not_edited':base.body.includes('Слушайте посылы, которые меняют мозг на физиологическом уровне'),
            'base_checkout_original':base.body.includes("source:'marafon_ai_audioanchors_1990'"),
          };
          console.log('SITE_CHECKS',JSON.stringify(checks));
          assert.ok(Object.values(checks).every(Boolean),'Published site mismatch');
          const tracker=await read('/ai/avtor/classic-goals.js');
          const tr={
            http:tracker.status,
            pathIsolated:tracker.body.includes("if(!/^\\/ai\\/avtor\\/?$/.test(location.pathname))return;"),
            correctVariant:tracker.body.includes("variant:'classic_author_1990'"),
          };
          console.log('TRACKER_CHECKS',JSON.stringify(tr));
          assert.equal(tracker.status,200);
          assert.ok(tr.pathIsolated&&tr.correctVariant);
          const audio=await fetch(origin+'/ai/assets/life-gets-better-demo-20261008.mp3',{method:'HEAD',signal:AbortSignal.timeout(14000)});
          const image=await fetch(origin+'/ai/assets/anchor-release-20261008.webp',{method:'HEAD',signal:AbortSignal.timeout(14000)});
          const portrait=await fetch(origin+'/ai/avtor/assets/author-portrait-20261025.jpg',{method:'HEAD',signal:AbortSignal.timeout(14000)});
          console.log('ASSETS',JSON.stringify({audio:audio.status,image:image.status,portrait:portrait.status,portraitType:portrait.headers.get('content-type')}));
          assert.ok(audio.ok&&image.ok&&portrait.ok);
          assert.ok((portrait.headers.get('content-type')||'').includes('image/jpeg'));
          assert.ok(Number(portrait.headers.get('content-length'))>60000);
          console.log('PASS: /ai/avtor/ publicly served with revised author story/demo/mobile chip, tracker isolated, assets load, original /ai/ untouched');
          JS
      - name: Chromium mobile and desktop clickthrough test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const vp of [{width:1440,height:900,label:'desktop'},{width:390,height:844,label:'mobile'},{width:320,height:720,label:'small-mobile'}]){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:1});
              await page.goto('https://marafon-metod.ru/ai/avtor/?responsive_check=20261025',{waitUntil:'domcontentloaded',timeout:35000});
              await page.locator('.hero h1').waitFor({state:'visible'});
              await page.locator('.author-photo').evaluate(img=>img.decode());
              const visual=await page.evaluate(()=>{
                const identity=document.querySelector('.author-mobile-identity');
                const demo=document.querySelector('.hero .author-demo-cta');
                const photo=document.querySelector('.hero .author-photo');
                return {
                  inner:window.innerWidth,
                  scrollWidth:document.documentElement.scrollWidth,
                  identityVisible:identity && getComputedStyle(identity).display!=='none',
                  identityTop:identity?.getBoundingClientRect().top,
                  demoVisible:demo && getComputedStyle(demo).display!=='none',
                  photoLoaded:!!(photo?.complete&&photo.naturalWidth>0),
                  price:document.body.textContent.includes('1 990 ₽'),
                  lead:document.querySelector('.hero-lead')?.textContent||''
                };
              });
              console.log('BROWSER_CHECK',vp.label,JSON.stringify(visual));
              assert.ok(visual.scrollWidth<=visual.inner+4,'Unexpected horizontal scrollbar');
              assert.ok(visual.demoVisible&&visual.photoLoaded&&visual.price);
              assert.ok(visual.lead.includes('клинике Аллена Карра'));
              assert.equal(visual.identityVisible,vp.width<=800);
              if(vp.width<=800)assert.ok(visual.identityTop>=0&&visual.identityTop<vp.height,'Author identity must appear above mobile fold');
              await page.locator('.hero .author-demo-cta').click();
              await page.locator('#audio-dialog').waitFor({state:'visible'});
              await page.locator('#audio-dialog [data-modal-close]').first().click();
              await page.locator('.hero button[data-buy]').click();
              await page.locator('#purchase-dialog').waitFor({state:'visible'});
              assert.ok((await page.locator('#purchase-dialog').innerText()).includes('1 990 ₽'));
              await page.screenshot({path:'/tmp/avtor-'+vp.label+'.png',fullPage:false});
              await page.close();
            }
            console.log('BROWSER_PASS: desktop/mobile no overflow, identity above fold, image loaded, demo and checkout dialogs work');
          }finally{await browser.close()}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avtor-hero-responsive-20261025
          path: /tmp/avtor-*.png
          retention-days: 2
