name: AI 68 Metrika goals installation
on:
  push:
    branches: [main]
    paths:
      - "ai/goals.json"
      - "ai/sync_metrika_goals.py"
      - ".github/workflows/ai-install-metrika-goals.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yandex-metrika-goals-110906734
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      YANDEX_METRIKA_OAUTH: ${{ secrets.YANDEX_METRIKA_OAUTH }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing goals and detect name / ID collisions
        env:
          METRIKA_SYNC_MODE: check
        run: python3 ai/sync_metrika_goals.py
      - name: Create only missing goals and verify all 68
        env:
          METRIKA_SYNC_MODE: apply
        run: python3 ai/sync_metrika_goals.py
