name: Marafon root QA
on:
  push:
    paths:
      - '.github/workflows/marafon-root-qa.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for production root and test lead delivery
        shell: bash
        run: |
          set -euo pipefail

          ok=0
          for i in $(seq 1 24); do
            code="$(curl -L --silent --show-error --output /tmp/root.html --write-out '%{http_code}' --max-time 30 'https://marafon-metod.ru/?qa_root=0927' || true)"
            echo "attempt=$i http=$code bytes=$(wc -c </tmp/root.html 2>/dev/null || echo 0)"
            if [ "$code" = "200" ] && grep -Fq 'Последняя сигарета — курс Ильи Борзилова' /tmp/root.html && grep -Fq '110906734' /tmp/root.html; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "Production root did not switch in time"
            head -c 1000 /tmp/root.html || true
            exit 1
          fi

          python3 - <<'PY'
          page=open('/tmp/root.html','r',encoding='utf-8').read()
          checks={
            'title':'Последняя сигарета — курс Ильи Борзилова' in page,
            'metrika_new':'110906734' in page,
            'metrika_old':'109705214' not in page,
            'lead_endpoint':'https://api.marafon-metod.ru/api/leads' in page,
            'desktop_asset':'/sigareta/freedom-desktop.webp' in page,
            'mobile_asset':'/sigareta/freedom-mobile.webp' in page,
            'phone':'data-contact-type="phone"' in page,
            'telegram':'data-contact-type="telegram"' in page,
            'max':'data-contact-type="max"' in page,
          }
          print('ROOT_CHECKS',checks)
          if not all(checks.values()): raise SystemExit(checks)
          PY

          payload='{"formType":"footer_application","name":"TEST MARAFON ROOT 2026-09-27","contactType":"phone","contact":"+7 999 111-22-33","message":"TEST MARAFON ROOT 2026-09-27 · end-to-end проверка заявки с marafon-metod.ru. Это тест, реального клиента нет.","price":"","source":"marafon_root_test","sourceUrl":"https://marafon-metod.ru/?qa_lead=1","referrer":"github-actions-qa","utm":{"source":"qa_test","medium":"github_actions","campaign":"marafon_root_e2e","content":"","term":""},"website":""}'
          response="$(curl --silent --show-error --fail --max-time 30             -X POST 'https://api.marafon-metod.ru/api/leads'             -H 'Origin: https://marafon-metod.ru'             -H 'Content-Type: application/json'             -H 'Accept: application/json'             --data "$payload")"
          echo "$response"

          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESPONSE'])
          if data.get('ok') is not True: raise SystemExit(data)
          channels=data.get('channels') or {}
          if channels.get('email') is not True: raise SystemExit(data)
          print('LEAD_QA_OK',data.get('leadId'),'email=true')
          PY
