name: AI launch live audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-launch-live-audit.yml"
      - "ai/index.html"
      - "ai/archive-2026-10-22/**"
      - "ai/audio-player-prod-20261022.js"
      - "ai/landing-prod-20261022.css"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify newly promoted /ai/ and immutable archive on public domain
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time,sys,os
          from urllib.parse import quote
          base='https://marafon-metod.ru'
          archive='/ai/archive-pre-optimize-20261022-1800/'
          def get(path):
              req=urllib.request.Request(base+quote(path,safe='/?=&'),headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as res:
                  return res.status,res.read().decode('utf-8','replace')
          for attempt in range(1,19):
              try:
                  nonce='?release_audit='+os.environ.get('GITHUB_RUN_ID','test')+'&attempt='+str(attempt)
                  live_status,html=get('/ai/'+nonce)
                  old_status,old=get(archive+nonce)
                  jsstatus,js=get('/ai/live-20261022/pult.js'+nonce)
                  cssstatus,css=get('/ai/live-20261022/air.css'+nonce)
                  checks={
                    'http200':all(code==200 for code in (live_status,old_status,jsstatus,cssstatus)),
                    'new_sections_order':all(i>=0 for i in [html.find('id="top"'),html.find('id="audio-path"'),html.find('id="albums"'),html.find('id="calc-showcase"')]) and html.find('id="top"')<html.find('id="audio-path"')<html.find('id="albums"')<html.find('id="calc-showcase"')<html.find('id="pricing"'),
                    'new_quote':'Аудиоякоря работают не с силой воли' in html,
                    'compact_demo':'id="opt-demo"' in html and 'Под гитару' in js and 'Душевная эстрада' in js and 'Современное звучание' in js,
                    'audio_milestones':"aiGoals" in js and "_50" in js and "_90" in js,
                    'live_assets':'/ai/live-20261022/pult.js?v=' in html and '/ai/live-20261022/air.css?v=' in html and 'audio-loop-section#audio-path' in css,
                    'seamless_essence':'opt-essence-seamless-critical-20261022' in html and 'background:var(--bg,#111412)!important' in html,
                    'no_test_asset_link':'href="/ai/оптимайз/' not in html and 'src="/ai/оптимайз/' not in html,
                    'metrika_one_bootstrap':html.count('mc.yandex.ru/metrika/tag.js?id=110906734')==1,
                    'analytics':'G-J076WS14NV' in html and '/ai/posthog-init.js' in html and '/ai/goal-tracking.js' in html and '/analytics.js' in html,
                    'canonical':'rel="canonical" href="https://marafon-metod.ru/ai/"' in html,
                    'checkout':'/predfinal/checkout.js?v=20261020-errorcode-v11' in html,
                    'cards':all('data-price-card="'+tier+'"' in html for tier in ('one','all','duo')),
                    'archive': 'FROZEN ARCHIVE' in old and '/ai/archive-pre-optimize-20261022-1800/landing.css' in old and '/ai/archive-pre-optimize-20261022-1800/audio-player.js' in old,
                    'archive_analytics_disabled': 'mc.yandex.ru/metrika' not in old and 'G-J076WS14NV' not in old,
                  }
                  print('RELEASE_AUDIT',attempt,checks,flush=True)
                  if all(checks.values()):
                      print('LIVE_OPTIMIZED_AI_AND_INDEPENDENT_ARCHIVE_CONFIRMED',flush=True)
                      sys.exit(0)
              except Exception as e:
                  print('AUDIT_ATTEMPT',attempt,'EXCEPTION',type(e).__name__,str(e)[:150],flush=True)
              if attempt<18:time.sleep(8)
          sys.exit('LIVE_PROMOTION_NOT_VERIFIED')
          PY
      - name: Read-only payment backend readiness
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,sys,json
          base='https://ilaborzilov0-netizen-metod-payment-test-0305.twc1.net'
          url=base+'/api/payment/plans'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=16) as r:
                  data=json.load(r)
                  print('Server status',r.status,'plans',data.get('tariffs'),'testMode',data.get('testMode'))
                  if data.get('tariffs')=={'audio_pair_one':199000,'audio_pair_all':299000,'audio_pair_duo':449000} and data.get('testMode') is False:
                      print('PASS: payment server reflects expected production prices');sys.exit(0)
                  print('BLOCKER: payment server prices not production-ready');sys.exit(1)
          except urllib.error.HTTPError as e:
              print('BLOCKER: payment server GET /api/payment/plans returned',e.code)
              sys.exit(1)
          except Exception as e:
              print('BLOCKER: could not verify payment server:',repr(e));sys.exit(1)
          PY
