name: AI launch live audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-launch-live-audit.yml"
      - "ai/index.html"
      - "ai/archive-2026-10-22/**"
      - "ai/audio-player-prod-20261022.js"
      - "ai/landing-prod-20261022.css"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify current optimized /ai/ and preserved archive through public domain
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,time,sys,os
          from urllib.parse import quote
          base='https://marafon-metod.ru'
          def get(path):
              req=urllib.request.Request(base+quote(path,safe='/?=&'),headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as res:
                  return res.status,res.read().decode('utf-8','replace')
          for attempt in range(1,19):
              try:
                  status,html=get('/ai/?deploy_audit=20261022&run='+os.environ.get('GITHUB_RUN_ID','test')+'&attempt='+str(attempt))
                  archived,old=get('/ai/archive-2026-10-22/?deploy_audit=20261022')
                  jsstatus,js=get('/ai/audio-player-prod-20261022.js?v=1')
                  checks={
                    'http200':status==200 and archived==200 and jsstatus==200,
                    'promoted_heading':'<span class="ai-test-title-main">Бросьте курить</span>' in html,
                    'new_audio_panel':'id="opt-demo"' in html,
                    'three_audio_sources':'Под гитару' in js and 'Душевная эстрада' in js and 'Современное звучание' in js,
                    'milestone_events':"'_50'" in js and "'_90'" in js and 'aiGoals' in js,
                    'metrika_one_bootstrap':html.count('mc.yandex.ru/metrika/tag.js?id=110906734')==1,
                    'canonical':'rel="canonical" href="https://marafon-metod.ru/ai/"' in html,
                    'goal_script':'/ai/goal-tracking.js?v=20261022-new-player-v1' in html,
                    'frozen_player_src':'/ai/audio-player-prod-20261022.js?v=1' in html,
                    'frozen_css_src':'/ai/landing-prod-20261022.css?v=1' in html,
                    'journey_loader':'/analytics.js?v=20261022-new-views-v1' in html,
                    'checkout':'/predfinal/checkout.js?v=20261020-errorcode-v11' in html,
                    'cards':all('data-price-card="'+tier+'"' in html for tier in ('one','all','duo')),
                    'backup_preserved':'<span class="ai-test-title-main">Бросьте курить,</span>' in old and 'id="opt-demo"' not in old,
                  }
                  print('DEPLOY_AUDIT',attempt,checks,flush=True)
                  if all(checks.values()):
                      print('LIVE_NEW_AI_AND_ARCHIVE_CONFIRMED',flush=True)
                      sys.exit(0)
              except Exception as e:
                  print('AUDIT_ATTEMPT',attempt,'EXCEPTION',type(e).__name__,str(e)[:150],flush=True)
              if attempt<18:time.sleep(8)
          sys.exit('LIVE_NEW_AI_NOT_VERIFIED')
          PY
      - name: Read-only payment backend readiness
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,sys,json
          base='https://ilaborzilov0-netizen-metod-payment-test-0305.twc1.net'
          url=base+'/api/payment/plans'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=16) as r:
                  data=json.load(r)
                  print('Server status',r.status,'plans',data.get('tariffs'),'testMode',data.get('testMode'))
                  if data.get('tariffs')=={'audio_pair_one':199000,'audio_pair_all':299000,'audio_pair_duo':449000} and data.get('testMode') is False:
                      print('PASS: payment server reflects expected production prices');sys.exit(0)
                  print('BLOCKER: payment server prices not production-ready');sys.exit(1)
          except urllib.error.HTTPError as e:
              print('BLOCKER: payment server GET /api/payment/plans returned',e.code)
              sys.exit(1)
          except Exception as e:
              print('BLOCKER: could not verify payment server:',repr(e));sys.exit(1)
          PY
