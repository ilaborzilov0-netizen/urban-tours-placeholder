name: AI launch live audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-launch-live-audit.yml"
      - "ai/index.html"
      - "yakorya-ai-archive-20261020/index.html"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify live /ai/ and archive before traffic
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, time, re, sys, os
          root='https://marafon-metod.ru'
          def get(path):
              url=root+path
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  return r.status,r.read().decode('utf-8','replace')
          for n in range(1,7):
              try:
                  livecode,live=get('/ai/?launch_audit=20261021&run='+os.getenv('GITHUB_RUN_ID','manual')+'&n='+str(n))
                  oldcode,old=get('/yakorya-ai-archive-20261020/?launch_audit=20261020')
                  good=(
                      livecode==200 and oldcode==200
                      and 'class="hero-priority"' in live
                      and ('<span class="hero-offer-contents">Два альбома · 20 аудиоякорей</span>' in live and '<span class="hero-offer-price">от 1 990 ₽</span>' in live and live.index('class="hero-priority"') < live.index('class="hero-offer-summary"') < live.index('class="hero-lead"'))
                      and all(cta in live for cta in (
                          '<a class="btn btn-primary album-showcase-cta" href="#pricing">Выбрать комплект →</a>',
                          '<a class="freedom-vision-cta" href="#pricing">Выбрать комплект →</a>',
                          '<a class="predfinal-final-invitation-cta" href="#pricing">Выбрать комплект →</a>'
                      ))
                      and 'data-select-plan="one"' in live
                      and 'data-select-plan="all"' in live
                      and 'data-select-plan="duo"' in live
                      and 'id="smoking-savings"' in live
                      and 'data-annual-savings' in live
                      and 'class="hero-refund-guarantee"' in live
                      and live.count('class="price-refund-note"')==3
                      and 'id="guarantee"' in live
                      and 'id="guarantee-faq"' in live
                      and 'Как работает гарантия возврата денег?' in live
                      and 'https://t.me/metodborzilova' in live
                      and live.index('data-price-card="duo"') < live.index('id="guarantee"') < live.index('data-annual-savings')

                      and live.count('class="ai-question-prompt"')==2
                      and 'data-question-location="pricing">Напишите мне — разберёмся.</button>' in live
                      and 'data-question-location="faq">Напишите мне — разберёмся.</button>' in live
                      and 'class="predfinal-faq-contact"' not in live
                      and 'class="author-contact-title">Есть вопрос? Напишите мне, разберёмся.</p>' in live
                      and live.index('class="predfinal-final-invitation-cta"') < live.index('class="predfinal-final-contact"') < live.index('<footer class="wrap footer">')
                      and 'value="200" aria-describedby="smoking-calc-note"' in live
                      and 'data-smoking-equivalent="one"' not in live
                      and live.count('data-smoking-equivalent="all"')==1
                      and 'data-smoking-equivalent="duo"' not in live
                      and '/predfinal/offer.js?v=20261021-savings-v38' in live
                      and '/predfinal/checkout.js?' in live
                      and '110906734' in live
                      and 'href="https://marafon-metod.ru/ai/"' in live
                      and 'АРХИВ · 20 октября 2026' in old
                      and 'Все 12 аудиоякорей' in old
                  )
                  flags={
                    'priority': 'class="hero-priority"' in live,
                    'starting_price_line': ('<span class="hero-offer-contents">Два альбома · 20 аудиоякорей</span>' in live and '<span class="hero-offer-price">от 1 990 ₽</span>' in live and live.index('class="hero-priority"') < live.index('class="hero-offer-summary"') < live.index('class="hero-lead"')),
                    'intermediate_ctas': all(cta in live for cta in (
                      '<a class="btn btn-primary album-showcase-cta" href="#pricing">Выбрать комплект →</a>',
                      '<a class="freedom-vision-cta" href="#pricing">Выбрать комплект →</a>',
                      '<a class="predfinal-final-invitation-cta" href="#pricing">Выбрать комплект →</a>'
                    )),
                    'one':'data-select-plan="one"' in live,
                    'all':'data-select-plan="all"' in live,
                    'duo':'data-select-plan="duo"' in live,
                    'savings':'id="smoking-savings"' in live,
                    'payback_only_featured': 'data-smoking-equivalent="one"' not in live and live.count('data-smoking-equivalent="all"')==1 and 'data-smoking-equivalent="duo"' not in live,
                    'annual_panel': 'data-annual-savings' in live,
                    'refund_hero': 'class="hero-refund-guarantee"' in live,
                    'refund_all_three': live.count('class="price-refund-note"')==3,
                    'refund_below_tiers': 'id="guarantee"' in live and live.index('data-price-card="duo"') < live.index('id="guarantee"') < live.index('data-annual-savings'),
                    'refund_faq': 'id="guarantee-faq"' in live and 'Как работает гарантия возврата денег?' in live,
                    'question_prompts_two_lines': live.count('class="ai-question-prompt"')==2,
                    'footer_question_below_cta': 'class="predfinal-final-contact"' in live and live.index('class="predfinal-final-invitation-cta"') < live.index('class="predfinal-final-contact"') < live.index('<footer class="wrap footer">'),
                    'no_question_in_faq': 'class="predfinal-faq-contact"' not in live,
                    'author_question_unchanged': 'class="author-contact-title">Есть вопрос? Напишите мне, разберёмся.</p>' in live,
                    'default_pack_200':'value="200" aria-describedby="smoking-calc-note"' in live,
                    'new_savings_script':'/predfinal/offer.js?v=20261021-savings-v38' in live,
                    'checkout_script':'/predfinal/checkout.js?' in live,
                    'metrika':'110906734' in live,
                    'canonical':'href="https://marafon-metod.ru/ai/"' in live,
                    'archive_banner':'АРХИВ · 20 октября 2026' in old,
                    'archive_copy':'Все 12 аудиоякорей' in old,
                  }
                  print('Attempt',n,'new AI live',livecode,'archive live',oldcode,'new page verified',good,'checks:',flags)
                  print('CTA deployment diagnostic:', {
                    'demo_to_pricing': '<a class="btn btn-primary album-showcase-cta" href="#pricing">Выбрать комплект →</a>' in live,
                    'freedom_to_pricing': '<a class="freedom-vision-cta" href="#pricing">Выбрать комплект →</a>' in live,
                    'final_to_pricing': '<a class="predfinal-final-invitation-cta" href="#pricing">Выбрать комплект →</a>' in live,
                    'old_demo_price': 'Выбрать комплект · от 1 990 ₽ →' in live,
                    'old_freedom_listen': 'Начните с прослушивания' in live,
                    'old_final_listen': 'Послушать фрагменты <span aria-hidden="true">↗</span>' in live,
                  })
                  print('Offer placement diagnostic:',{
                    'contents': '<span class="hero-offer-contents">Два альбома · 20 аудиоякорей</span>' in live,
                    'price': '<span class="hero-offer-price">от 1 990 ₽</span>' in live,
                    'priority_at':live.find('class="hero-priority"'),
                    'offer_at':live.find('class="hero-offer-summary"'),
                    'lead_at':live.find('class="hero-lead"'),
                    'old_one_line': 'Два альбома · 20 аудиоякорей · от 1 990 ₽' in live
                  })
                  if good:break
              except Exception as e:print('Attempt',n,'error',repr(e))
              time.sleep(4)
          else:sys.exit('FAIL: live /ai or archive has not deployed')
          for resource in [
              '/predfinal/offer.css?v=20261020-pricing-minimal-v38',
              '/predfinal/offer.js?v=20261021-savings-v38',
              '/predfinal/checkout.js?v=20261020-errorcode-v11',
              '/ai/offer-compact.css?v=20261018-author1',
              '/ai/checkout.js?v=20261018-author1']:
              status,body=get(resource)
              print('Referenced resource',resource,'status',status,'bytes',len(body))
              if status!=200 or not body:sys.exit('FAIL: missing '+resource)
          print('PASS: new live /ai, old archived /ai, Yandex ID, three tiers, demo references and linked assets.')
          PY
      - name: Read-only payment backend readiness
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,sys,json
          base='https://ilaborzilov0-netizen-metod-payment-test-0305.twc1.net'
          url=base+'/api/payment/plans'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=16) as r:
                  data=json.load(r)
                  print('Server status',r.status,'plans',data.get('tariffs'),'testMode',data.get('testMode'))
                  if data.get('tariffs')=={'audio_pair_one':199000,'audio_pair_all':299000,'audio_pair_duo':449000} and data.get('testMode') is False:
                      print('PASS: payment server reflects expected production prices');sys.exit(0)
                  print('BLOCKER: payment server prices not production-ready');sys.exit(1)
          except urllib.error.HTTPError as e:
              print('BLOCKER: payment server GET /api/payment/plans returned',e.code)
              sys.exit(1)
          except Exception as e:
              print('BLOCKER: could not verify payment server:',repr(e));sys.exit(1)
          PY
