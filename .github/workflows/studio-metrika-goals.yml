name: Studio Yandex Metrika goal sync (additive only)
on:
  push:
    branches: [main]
    paths:
      - 'ai/studio-goals.json'
      - 'ai/sync_studio_metrika_goals.py'
      - '.github/workflows/studio-metrika-goals.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yandex-metrika-goals-110906734
  cancel-in-progress: false
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      YANDEX_METRIKA_OAUTH: ${{ secrets.YANDEX_METRIKA_OAUTH }}
    steps:
      - uses: actions/checkout@v4
      - name: Check current goal IDs, counter limit and name collisions
        env:
          METRIKA_SYNC_MODE: check
        run: python3 ai/sync_studio_metrika_goals.py
      - name: Add missing Studio goals (never delete old goals)
        env:
          METRIKA_SYNC_MODE: apply
        run: python3 ai/sync_studio_metrika_goals.py
