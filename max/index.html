      target.searchParams.set('source_page', 'marafon-metod.ru/max');

      finished = true;

      if(finished){ clearInterval(poll); return; }
      var cid = cookieClientId();
      if(cid){ clearInterval(poll); goTracked(cid); return; }
      attempts += 1;
      if(attempts >= 24) clearInterval(poll);
